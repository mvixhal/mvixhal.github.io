<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresho-Hub | Fresh Fruits & Vegetables</title>

    <meta name="description" content="Buy fresh fruits and vegetables online in Kota. Fast delivery and premium quality.">

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
    <div class="top-bar">
        <div class="logo">
            <i class="fa-solid fa-leaf"></i>
            <h1>Fresho-Hub</h1>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search Fruits, Vegetables, Grocery...">
            <button aria-label="Search">
                <i class="fa fa-search"></i>
            </button>
        </div>

        <div class="header-icons">
            <a href="login.html" aria-label="User Profile">
                <i class="fa-regular fa-user"></i>
            </a>
            <a href="#" aria-label="Wishlist">
                <i class="fa-regular fa-heart"></i>
            </a>
            <a href="#" aria-label="Shopping Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="offers.html">Offers</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Farm Fresh Delivered To Your Doorstep</h2>
            <p>Fresh Fruits, Vegetables & Grocery Delivered Across Kota.</p>
            <a href="products.html" class="btn">Shop Now</a>
        </div>
    </section>

    <!-- Categories Section -->
    <section class="categories">
        <h2>Shop By Category</h2>
        <div class="category-grid">
            <div class="category-card">
                <img src="images/categories/fruits.png" alt="Fruits">
                <h3>Fruits</h3>
            </div>

            <div class="category-card">
                <img src="images/categories/vegetables.png" alt="Vegetables">
                <h3>Vegetables</h3>
            </div>

            <div class="category-card">
                <img src="images/categories/dairy.png" alt="Dairy">
                <h3>Dairy</h3>
            </div>

            <div class="category-card">
                <img src="images/categories/beverages.png" alt="Beverages">
                <h3>Beverages</h3>
            </div>

            <div class="category-card">
                <img src="images/categories/grocery.png" alt="Grocery">
                <h3>Grocery</h3>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="footer-content" style="text-align: center; padding: 2rem; background: #333; color: #fff;">
        <p>&copy; 2026 Fresho-Hub. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
